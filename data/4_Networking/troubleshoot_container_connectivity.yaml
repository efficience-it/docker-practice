questions:
  - uuid: 1fdce7fa-221e-4a0a-9481-39e3b7270f6c
    question: Which command lets you view logs generated by a running container?
    answers:
      - { value: 'docker logs <container_id>', correct: true }
      - { value: 'docker inspect logs <container_id>', correct: false }
      - { value: 'docker journal <container_id>', correct: false }
      - { value: 'docker view --logs <container_id>', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/logs/

  - uuid: ab6f8b94-f195-49cc-8e89-5c3427467fe5
    question: Which command helps diagnose network-related settings of a container?
    answers:
      - { value: 'docker inspect <container_id>', correct: true }
      - { value: 'docker logs <container_id>', correct: false }
      - { value: 'docker ps -a', correct: false }
      - { value: 'docker images', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/inspect/

  - uuid: 56f5126e-34dc-443f-8c18-92e4f69399ef
    question: What section of `docker inspect` output contains the container's network settings?
    answers:
      - { value: '.NetworkSettings', correct: true }
      - { value: '.HostConfig', correct: false }
      - { value: '.Mounts', correct: false }
      - { value: '.State.Network', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/inspect/

  - uuid: e02f94aa-0d40-4b63-9e3f-84b4cc68436c
    question: What is a common reason two containers on the same bridge network cannot communicate?
    answers:
      - { value: 'Exposed ports are not needed for container-to-container communication', correct: true }
      - { value: 'DNS resolution is disabled by default', correct: false }
      - { value: 'Containers must run with --host networking', correct: false }
      - { value: 'Containers need unique volume names', correct: false }
    help: https://docs.docker.com/network/bridge/

  - uuid: a1766e64-d4cd-49db-859f-6d1f27f33aa3
    question: How can you view logs for the Docker engine itself on a Linux system using systemd?
    answers:
      - { value: 'journalctl -u docker.service', correct: true }
      - { value: 'docker logs engine', correct: false }
      - { value: 'systemctl view docker', correct: false }
      - { value: 'docker system logs', correct: false }
    help: https://docs.docker.com/config/daemon/#viewing-engine-logs

  - uuid: bbe8dbcc-1d66-4db2-9b19-31d312d2f5e1
    question: A container connected to an overlay network cannot resolve another container’s name. What is the likely issue?
    answers:
      - { value: 'The container is not attached to the same overlay network', correct: true }
      - { value: 'The container needs a published port', correct: false }
      - { value: 'Overlay networks do not support DNS resolution', correct: false }
      - { value: 'The host network is required for DNS lookups', correct: false }
    help: https://docs.docker.com/network/overlay/#service-discovery

  - uuid: d28924eb-6e99-4b3c-8c6c-c2a416327eb3
    question: What command can help you check whether a container can reach another container by hostname?
    answers:
      - { value: 'docker exec <container> ping <target_container_name>', correct: true }
      - { value: 'docker ps --ping', correct: false }
      - { value: 'docker logs --connectivity-check', correct: false }
      - { value: 'docker inspect --trace', correct: false }
    help: https://docs.docker.com/network/bridge/#communicating-between-containers

  - uuid: 9e963a4f-38f2-4fef-8f55-b79c9cf61f35
    question: How can you confirm if a container is attached to the correct network?
    answers:
      - { value: 'docker network inspect <network_name>', correct: true }
      - { value: 'docker container status <container_id>', correct: false }
      - { value: 'docker service ls --networks', correct: false }
      - { value: 'docker logs <container_id> --network', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_inspect/
