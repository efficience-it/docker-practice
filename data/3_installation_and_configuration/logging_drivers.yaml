questions:
  - uuid: 8f6f353b-0c99-47df-ae3b-6e61864ec106
    question: Which parameter specifies a log driver when launching a container?
    answers:
      - { value: "--logging", correct: false }
      - { value: "--driver-log", correct: false }
      - { value: "--log", correct: false }
      - { value: "--log-driver", correct: true }
    help: https://docs.docker.com/config/containers/logging/configure/

  - uuid: 43fd04d9-df6b-4f17-b682-46429a24a537
    question: Which file configures the default global log driver?
    answers:
      - { value: "/usr/local/docker/logging.json", correct: false }
      - { value: "/etc/docker/containers/logging.conf", correct: false }
      - { value: "/etc/logging.conf", correct: false }
      - { value: "/etc/docker/daemon.json", correct: true }
    help: https://docs.docker.com/config/containers/logging/configure/

  - uuid: a0629d6c-313c-4e3b-a2d2-e1122859c3f5
    question: Which value sets `journald` as the log driver for a Docker container?
    answers:
      - { value: "journald", correct: true }
      - { value: "docker-logs", correct: false }
      - { value: "syslogd", correct: false }
      - { value: "systemd-logs", correct: false }
    help: https://docs.docker.com/config/containers/logging/journald/

  - uuid: 50e888f9-d205-4de7-8054-bb7409d504d6
    question: What is Docker’s default log driver?
    answers:
      - { value: "none", correct: false }
      - { value: "journald", correct: false }
      - { value: "syslog", correct: false }
      - { value: "json-file", correct: true }
    help: https://docs.docker.com/config/containers/logging/configure/

  - uuid: 5d3c3e90-0f03-4f2e-9d02-b8d52ed9f146
    question: Which JSON configuration sets journald as the global log driver?
    answers:
      - { value: "{ `logging-driver`: `journald` }", correct: false }
      - { value: "{ `driver`: `journald` }", correct: false }
      - { value: "{ `log-driver`: `journald` }", correct: true }
      - { value: "{ `logs`: `journald` }", correct: false }
    help: https://docs.docker.com/config/containers/logging/configure/

  - uuid: 1ec259ae-b1f6-4a4d-91f2-697d63b37823
    question: Quel driver de logs est utilisé pour envoyer les logs vers une instance Splunk ?
    answers:
      - { value: "logstash", correct: false }
      - { value: "splunk", correct: true }
      - { value: "fluentd", correct: false }
      - { value: "gelf", correct: false }
    help: https://docs.docker.com/config/containers/logging/splunk/

  - uuid: 91e16669-03b9-47ef-a93e-7e6c84cf4fe4
    question: Quel paramètre est requis pour le driver `splunk` ?
    answers:
      - { value: "splunk-user", correct: false }
      - { value: "splunk-port", correct: false }
      - { value: "splunk-token", correct: true }
      - { value: "splunk-password", correct: false }
    help: https://docs.docker.com/config/containers/logging/splunk/

  - uuid: b0b7b3d6-dca0-40d7-881a-e0d1e8e6d7c7
    question: Quelle commande permet de lancer un conteneur avec un driver de log personnalisé ?
    answers:
      - { value: "docker start --driver-log=syslog nginx", correct: false }
      - { value: "docker run --log-driver=syslog nginx", correct: true }
      - { value: "docker logs --driver=syslog nginx", correct: false }
      - { value: "docker create --log=syslog nginx", correct: false }
    help: https://docs.docker.com/config/containers/logging/configure/

  - uuid: 03e1fa7d-1e62-4ea3-a07f-b8912c51bb77
    question: Que se passe-t-il si un driver de logs est mal configuré au lancement d’un conteneur ?
    answers:
      - { value: "Docker remplace automatiquement par le driver `json-file`", correct: false }
      - { value: "Docker lance le conteneur avec syslog en fallback", correct: false }
      - { value: "Le conteneur ne démarre pas et une erreur s’affiche", correct: true }
      - { value: "Le conteneur démarre mais les logs sont perdus", correct: false }
    help: https://docs.docker.com/config/containers/logging/configure/

  - uuid: 17b2435a-4b75-423c-85ec-e24a91b2ad52
    question: Quel driver de log permet d’ignorer complètement les logs d’un conteneur ?
    answers:
      - { value: "off", correct: false }
      - { value: "null", correct: false }
      - { value: "disabled", correct: false }
      - { value: "none", correct: true }
    help: https://docs.docker.com/engine/logging/configure/#configure-the-logging-driver-for-a-container
